button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--v4-cyan);outline-offset:3px;box-shadow:0 0 0 5px #57e4f418}
button:disabled{opacity:.43}
::selection{background:#57e4f44d;color:white}
input,select,textarea{border:1px solid #35506b;background:#0b1625;color:#edf5ff;border-radius:6px;min-height:44px;padding:11px 13px;box-shadow:inset 0 1px 5px #0005}
input::placeholder,textarea::placeholder{color:#7d95b0}
input:focus,select:focus,textarea:focus{border-color:#57e4f4}
input[type=range]{min-height:25px;accent-color:var(--v4-cyan);box-shadow:none;background:transparent}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--v4-lime)}
select option{background:#112035;color:#edf5ff}
label{color:#b0c3d8;letter-spacing:.2px;font-size:12px}
.muted{color:#96adc6}.good{color:#b7e77d}.bad{color:#ff9fa9}
.shell{min-height:100svh;isolation:isolate}
.main,.grid>.stack,.stack>*,.columns-2>*,.detail-grid>*,.metrics>*{min-width:0}
.sidebar{background:linear-gradient(175deg,#152538,#080f1c 65%);border-right:1px solid #36516d80;box-shadow:10px 0 48px #0002;padding-top:27px}
.sidebar:before{content:'';position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--v4-cyan),var(--v4-lime));pointer-events:none}
.brand{padding:0 6px;margin-bottom:29px}
.brand strong{font-size:20px;font-style:italic;font-weight:900;letter-spacing:1px;color:#f4f8ff;text-shadow:0 0 24px #57e4f42b}
.brand small{color:#6ca7b7;letter-spacing:2px;font-size:8px}
.brand-icon{background:linear-gradient(135deg,#b7ffe5,#57e4f4 65%);color:#081421;border-radius:7px;transform:skew(-7deg);box-shadow:0 0 26px #57e4f42b}
.brand-icon svg{transform:skew(7deg)}
.side-label{color:#7390ae;font-size:9px;font-weight:700;letter-spacing:2.3px}
.nav{gap:7px}.nav button{min-height:46px;color:#adbed3;border:1px solid transparent;border-radius:6px;position:relative;letter-spacing:.3px}
.nav button:hover:not(:disabled){background:#20384d80;color:#e7faff;border-color:#3f607a}
.nav button.active{background:linear-gradient(100deg,#d6fc50,#a9e65b);color:#111c20;font-weight:800;box-shadow:0 4px 20px #baf45120;border-color:#e5ff92}
.nav button.active:before{content:'';position:absolute;left:-19px;top:8px;bottom:8px;width:3px;background:#d6fc50;box-shadow:0 0 15px #d6fc50}
.nav button .notice{background:#101c24;color:#e1fd8c;border:1px solid #7ca840;border-radius:4px}
.side-player{background:linear-gradient(135deg,#21334b,#101c2d);border-color:#35506c;border-radius:7px;position:relative;overflow:hidden}
.side-player:after{content:'';position:absolute;right:-25px;bottom:-27px;width:80px;height:80px;border:1px solid #57e4f421;transform:rotate(35deg)}
.side-player strong{color:#f0f7ff;font-weight:750}.side-player small{color:#93adc7}
.side-status{color:#8ca7c1}.dot{background:#b9f86d;box-shadow:0 0 7px #b9f86d66}
.side-actions button{background:#12243a;border-color:#35506b;color:#bcd2e8;min-height:36px;border-radius:5px}
.side-actions button:hover{border-color:#57e4f4;background:#1b354c}.side-link{color:#91a9c3;min-height:35px}
.topbar{background:linear-gradient(90deg,#101c2cf2,#0d1725f5);border-bottom:1px solid #35506b;box-shadow:0 6px 30px #0003;position:relative}
.topbar:after{content:'';position:absolute;bottom:-1px;left:34px;width:78px;height:2px;background:#57e4f4;box-shadow:0 0 16px #57e4f44d}
.top-breadcrumb{color:#8ba3be;letter-spacing:.5px}.top-breadcrumb strong{color:#e8f2ff;font-weight:750}.top-actions{color:#9cb4cc}
.top-avatar{background:linear-gradient(150deg,#244660,#101b2b);border:1px solid #57e4f460;color:#a8eff3;border-radius:7px}
.mobile-brand{font-style:italic;letter-spacing:.7px;color:#f4f8ff}.mobile-brand svg{color:#57e4f4}
.page{max-width:1660px;padding-top:29px}
.heading{padding-bottom:17px;border-bottom:1px solid #29425880;align-items:center;margin-bottom:22px;position:relative}
.heading:after{content:'';position:absolute;left:0;bottom:-2px;width:54px;height:3px;background:linear-gradient(90deg,#57e4f4,#d6fc50)}
.eyebrow{color:#70d4e0;font-size:10px;font-weight:750;letter-spacing:2.2px}
.heading h1{color:#f3f7ff;font-size:29px;line-height:1.35;font-weight:850;letter-spacing:.5px;text-shadow:0 2px 20px #0004}
.heading p{color:#98aec7;max-width:760px;font-size:12px}
.btn{background:linear-gradient(100deg,#214d62,#173749);border:1px solid #4a8599;color:#edfaff;min-height:44px;border-radius:5px;font-weight:750;letter-spacing:.3px;box-shadow:inset 0 1px 0 #ffffff0d,0 4px 12px #0002}
.btn:hover:not(:disabled){background:linear-gradient(100deg,#2e687b,#20495c);border-color:#83e9f1;box-shadow:0 0 18px #57e4f417}
.btn.lime{background:linear-gradient(110deg,#e2ff71,#bdec45);border-color:#e9ffa0;color:#142015;box-shadow:0 4px 24px #d6fc5020}
.btn.lime:hover:not(:disabled){background:linear-gradient(110deg,#f0ffad,#d1fc68);border-color:#f0ffbd;box-shadow:0 0 26px #d6fc5030}
.btn.outline{background:#101f32;border:1px solid #3d5a77;color:#c1d5ec;box-shadow:none}
.btn.outline:hover:not(:disabled){background:#1b3147;border-color:#57b8cc;color:#e4faff}
.btn.ghost{background:#0c17274d;border-color:#5d829b;color:#c8e0ef}
.btn.danger{background:#3a1f30;border-color:#784050;color:#ffb6be}
.btn.small{min-height:36px;border-radius:5px}
.textbtn{color:#84dce9;min-height:36px;font-weight:600;text-underline-offset:4px}
.textbtn:hover:not(:disabled){color:#e0fd92;text-decoration:underline}
.pill,.badge{background:#1d3348;border:1px solid #38556e;color:#bfd8eb;border-radius:4px;font-weight:600;letter-spacing:.15px}
.pill.green{background:#233e2d;border-color:#52773a;color:#c7ef99}.pill.gold{background:#413322;border-color:#8d6c37;color:#f1d18f}.pill.red{background:#3d2330;border-color:#7e4353;color:#ffb2ba}
.badge.real{background:#183749;border-color:#376581;color:#9bdef4}
.card,.profile,.offer,.metric,.agent-card,.route-card,.trophy,.china-club{background:var(--v4-panel);border-color:#30475f;border-radius:9px;box-shadow:0 8px 25px #0002,inset 0 1px 0 #c6e6ff08}
.card{position:relative}.card:before{content:'';position:absolute;left:0;top:18px;width:2px;height:24px;background:#57e4f4;opacity:.65;border-radius:0 3px 3px 0}
.section-head h2,.section-head h3{font-weight:750;font-size:14px;color:#eff7ff;letter-spacing:.3px}.section-head span{color:#8da7c2}

.career-hero:before{content:'';position:absolute;right:-45px;top:-50px;width:230px;height:410px;transform:skew(-25deg);background:linear-gradient(90deg,#57e4f408,#57e4f416);border-left:1px solid #57e4f426;pointer-events:none}
.career-hero:after{right:30px;top:-90px;width:350px;height:410px;border-color:#57e4f41c;background:repeating-linear-gradient(90deg,transparent 0 55px,#57e4f406 56px 110px)}
.career-hero .hero-content{max-width:80%;isolation:isolate}.career-hero .eyebrow{color:#c9f982;font-weight:800;letter-spacing:2.8px}
.career-hero h2{font-size:36px;font-weight:850;font-style:italic;line-height:1.45;margin:15px 0 12px;letter-spacing:1.1px;text-shadow:0 3px 20px #0006}
.career-hero p{color:#bed2e6;line-height:1.95;font-size:12px}.career-hero .hero-pitch{color:#8fdbed;opacity:.22;top:45px}
.hero-actions{margin-top:23px}.hero-actions small{color:#8db3c4}.hero-number{font-family:'Segoe UI',sans-serif;font-weight:950;font-size:145px;font-style:italic;color:#b2eeff0e;bottom:-28px;right:16px;letter-spacing:-10px}
.phase-track,.v3-pathline{background:#0c1728;border-color:#2c435c;border-radius:7px;box-shadow:inset 0 1px 6px #0004}
.phase-step,.v3-pathline>span{background:#122238;border:1px solid transparent;border-radius:5px;color:#819bb8}
.phase-step.active,.v3-pathline .active{background:linear-gradient(140deg,#254138,#172d31);border-color:#a2d34e66;color:#dbf4ac;box-shadow:inset 0 0 18px #d6fc5007}
.phase-step strong,.v3-pathline b{color:#99afc8}.phase-step small{color:#7f97b4}.phase-step.active strong,.phase-step.active small,.v3-pathline .active b{color:#d5f98a}
.phase-step.active:before{background:#d6fc50;box-shadow:0 0 8px #d6fc5066}
.metric{position:relative;overflow:hidden;padding:18px 18px 17px}
.metric:after{content:'';position:absolute;right:-6px;top:0;width:33px;height:100%;background:linear-gradient(180deg,#57e4f412,transparent);transform:skew(-16deg);border-left:1px solid #57e4f415}
.metric small{color:#a4bbd2;font-size:10px}.metric b{font-family:'Arial Narrow','Segoe UI',sans-serif;color:#f2f8ff;font-size:32px;line-height:1.15;font-weight:850;letter-spacing:-1px;margin:11px 0 7px}.metric p{color:#7f9bb7}
.metric:nth-child(2) b{color:#c9f878}.metric:nth-child(3) b{color:#7cdeef}.metric:nth-child(4) b{color:#e8c786}
.plan-choice{background:#0e1c2e;border-color:#2e4761;border-radius:6px;color:#d1deed;min-height:50px}
.plan-choice strong{color:#dce9f8;font-weight:650}.plan-choice small{color:#8ba5c0}
.plan-choice:hover:not(:disabled){background:#1a2e43;border-color:#6099ad}
.plan-choice.selected{background:linear-gradient(120deg,#203c3c,#172e35);border-color:#9fc95b;box-shadow:inset 3px 0 0 #d6fc50}
.plan-choice.selected strong{color:#dff9b4}.radio{border-color:#526c87;background:#0b1625}.selected .radio{border-color:#d6fc50;background:#203d36}
.hint,.risk-strip,.empty{color:#94acc5}.risk-strip{border-color:#2c455f}.empty{padding:35px 20px}.empty>svg{color:#59cbd9}
.profile{border:1px solid #57718a;border-radius:8px;box-shadow:0 8px 30px #0005}
.passport-head{background:radial-gradient(at 100% 0,#e9bf7030,transparent 70%),linear-gradient(120deg,#283849,#18273b);border-bottom:1px solid #826b464d;padding:22px;position:relative}
.passport-head:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(130deg,transparent 0 16px,#d2e6f504 16px 18px);pointer-events:none}
.passport-head .rating-number{color:#efd293;font-weight:900;font-style:italic;font-size:51px;text-shadow:0 2px 20px #e9bf7020;line-height:1.1}
.passport-head .rating-number small{color:#a7bbc9}.shirt{filter:drop-shadow(0 5px 12px #0008)}
.passport-body{background:linear-gradient(160deg,#18273bf2,#111c2d);padding-top:20px}
.passport-name{color:#f3f7ff;font-size:22px;font-weight:850}.passport-sub,.club-title small{color:#92abc4}
.divider{background:#2a435b}.profile-club{padding:3px 0}.club-title strong{color:#d9e8f7;font-weight:700}.crest{filter:drop-shadow(0 2px 5px #0005)}
.crest-fallback{background:#182b40;border-color:#3a5772;color:#a7bfd4}.profile-line span:first-child{color:#8fa9c3}.profile-line{color:#dce9f5}
.bar{background:#26394d;height:5px;border-radius:2px}.bar i{background:linear-gradient(90deg,#3db3c2,#bded7a);border-radius:2px;box-shadow:0 0 8px #57e4f430}
.barlabel{color:#c4d6e8}.barlabel span:last-child{color:#d0edb0}.body-mini b{color:#e7f2ff;font-weight:750}.body-mini b small,.body-mini span{color:#92abc3}
.note-card,.data-note,.settings-box,.fitness-state,.banner-note,.scope-banner,.v3-advice,.v3-roll,.mobile-help-status{background:linear-gradient(120deg,#162e40,#132436);border-color:#34546b;color:#a9c3d9;border-radius:7px}
.note-card h3,.settings-box h3{color:#d7ecf7;font-weight:750}.note-card p,.settings-box p,.fitness-state small,.banner-note,.data-note{color:#a3bdd3}
.note-card{border-left:3px solid #67c5d3}.fitness-state{border:1px solid #2e4b62}.fitness-state strong{color:#cce3f4}

/* New V4 career systems use the same visual language as the legacy pages. */
.v4-command-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 22px}
.v4-command{display:flex;flex-direction:column;justify-content:center;text-align:left;gap:6px;min-height:118px;position:relative;overflow:hidden;background:linear-gradient(135deg,#1c3b4b,#12253a);border:1px solid #47788c;border-radius:6px;padding:19px;color:#e7f7ff;box-shadow:0 7px 20px #0003}
.v4-command:after{content:'↗';font-size:40px;font-weight:400;position:absolute;right:17px;top:13px;opacity:.25;color:#8ae9ef;transform:skew(-12deg)}
.v4-command small{font-size:9px;color:#78dbe4;letter-spacing:1.6px;text-transform:uppercase;font-weight:750}.v4-command strong{font-size:18px;font-weight:850;line-height:1.5;padding-right:22px}.v4-command span{font-size:11px;color:#9dbacf;line-height:1.8}
.v4-command:hover:not(:disabled){border-color:#98ebed;background:linear-gradient(135deg,#285363,#193b4b);box-shadow:0 0 20px #57e4f41b}
.v4-command:first-child{background:linear-gradient(120deg,#d8fc62,#a8d642);color:#11222a;border-color:#edffa2}.v4-command:first-child small,.v4-command:first-child span{color:#3d542b}.v4-command:first-child:after{color:#27452c}.v4-command:first-child:hover{background:linear-gradient(120deg,#e9ff98,#c6ee5e)}
.v4-dashboard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:22px 0}
.v4-feature-tile{background:radial-gradient(at 100% 0,#57e4f414,transparent 80%),linear-gradient(125deg,#172a40,#101d30);border:1px solid #355670;border-radius:7px;padding:20px;min-width:0;position:relative;overflow:hidden}
.v4-feature-tile:before{content:'';position:absolute;inset:0 auto 0 0;width:3px;background:linear-gradient(#57e4f4,#57e4f400)}
.v4-feature-tile h3{font-size:15px;font-weight:800;color:#e5f5ff;margin:0 0 9px}.v4-feature-tile p{color:#96b2cc;font-size:12px;line-height:1.9}.v4-feature-tile>strong,.v4-feature-tile>b{color:#cef48d;font-size:24px;font-weight:850;display:block;margin:9px 0}
.v4-feature-tile .btn{margin-top:14px;max-width:100%}
.v4-trophy-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin:20px 0}
.v4-achievement{background:linear-gradient(135deg,#162438,#0f1c2d);border:1px solid #2d455e;border-radius:7px;padding:20px;position:relative;overflow:hidden;min-width:0;color:#819ab3}
.v4-achievement>svg{color:#64798e;filter:drop-shadow(0 2px 9px #0005)}.v4-achievement h3{font-size:14px;color:#b0c0d2;margin:12px 0 8px;font-weight:750}.v4-achievement p{font-size:11px;line-height:1.9;color:#8da4bd}.v4-achievement small{font-size:10px;color:#7795b0}
.v4-achievement.unlocked{border-color:#b69955;background:radial-gradient(at 100% 0,#e9bf7020,transparent 70%),linear-gradient(135deg,#303338,#172333);box-shadow:inset 0 3px 0 #e9bf70,0 8px 25px #0003;color:#f1d393}
.v4-achievement.unlocked:after{content:'✓';position:absolute;right:15px;top:12px;font-size:19px;color:#edcd83}.v4-achievement.unlocked>svg{color:#edca7e;filter:drop-shadow(0 0 12px #e9bf702b)}.v4-achievement.unlocked h3{color:#f3d99e}.v4-achievement.unlocked p{color:#c1bcaf}.v4-achievement.unlocked small{color:#d1b87e}
.v4-progress{display:block;height:6px;position:relative;overflow:hidden;background:#243951;border-radius:2px;margin-top:15px;border:1px solid #3b5269}.v4-progress>i,.v4-progress>span,.v4-progress>div{display:block;height:100%;background:linear-gradient(90deg,#3cb4ca,#c8f773);max-width:100%;border-radius:1px}.unlocked .v4-progress>i,.unlocked .v4-progress>span,.unlocked .v4-progress>div{background:linear-gradient(90deg,#b38c45,#f4da91)}
.v4-family-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:20px 0}
.v4-child-card{background:radial-gradient(at 100% 0,#b58aee1c,transparent 70%),linear-gradient(135deg,#202944,#131f34);border:1px solid #65628e;border-radius:8px;padding:23px;position:relative;overflow:hidden;min-width:0}
.v4-child-card:after{content:'';position:absolute;right:-36px;top:-20px;width:130px;height:190px;border:1px solid #b69ae630;transform:skew(-20deg);pointer-events:none}
.v4-child-card h3{font-size:20px;font-weight:850;color:#e8e1fb;margin-bottom:10px}.v4-child-card p{color:#aaaecf;font-size:12px;line-height:1.9}.v4-child-card .detail-grid>div{background:#111b30;border-color:#3a405e}.v4-child-card .btn{border-color:#7d73a4;background:linear-gradient(110deg,#4d4273,#302b52)}
.v4-bloodline{background:linear-gradient(105deg,#382d45,#1d2b42);border:1px solid #776384;border-left:3px solid #d6b0f3;border-radius:7px;padding:17px 20px;margin:17px 0;color:#d6c4e3;font-size:12px;line-height:1.9}
.v4-bloodline strong{color:#f1d9ff}.v4-bloodline small{color:#a69bc0}.v4-bloodline .badge{background:#4c3b59;border-color:#846393;color:#e3c7f8}
.v4-international{background:radial-gradient(at 100% 0,#f7bd6c13,transparent 70%),linear-gradient(130deg,#242a3b,#122338);border:1px solid #6e6652;border-radius:8px;padding:24px;margin:20px 0;color:#deeaf8}
.v4-international h2,.v4-international h3{color:#f1d8a5;font-weight:850}.v4-international p{color:#a7bbd0;font-size:12px;line-height:1.9}
.v4-callup{background:linear-gradient(110deg,#4b2d35,#243347);border:1px solid #996c6a;border-left:4px solid #edc778;border-radius:6px;padding:20px;position:relative;overflow:hidden;margin:16px 0;color:#f0dcc1}
.v4-callup strong{font-size:16px;font-weight:850;display:block;color:#ffedca}.v4-callup small{color:#c2aeb9}.v4-callup p{color:#c3becd}.v4-callup .btn{margin-top:13px}
.v4-fixture{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:17px;margin:10px 0;border:1px solid #35536e;border-radius:5px;background:#112238;font-size:12px;min-width:0}.v4-fixture strong{font-weight:800;color:#dfedfa}.v4-fixture small{color:#8eabc6;display:block;font-size:10px;margin-top:4px}.v4-fixture>span{color:#d1ef94;font-weight:750}.v4-fixture>div{min-width:0}
.v4-opponent{display:flex;align-items:center;gap:20px;background:radial-gradient(at 100% 0,#edc97b20,transparent 70%),linear-gradient(110deg,#1f354b,#111f33);border:1px solid #54768d;border-left:4px solid #57e4f4;border-radius:7px;padding:20px;margin:0 0 20px;overflow:hidden;position:relative;min-width:0}
.v4-opponent:after{content:'';position:absolute;right:-30px;top:-35px;width:100px;height:220px;transform:skew(-25deg);border-left:1px solid #57e4f440;background:#57e4f40a;pointer-events:none}
.v4-opponent h3{font-size:24px;font-style:italic;font-weight:900;color:#eff7ff;margin:3px 0 8px}.v4-opponent p{color:#a5bfd5;font-size:12px;line-height:1.9}.v4-opponent small{color:#8bd6e0}.v4-opponent>div{min-width:0}
.v4-player-art{flex-shrink:0;width:104px;height:123px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(at 50% 30%,#42637b,#14283d 70%);border:1px solid #789499;border-radius:6px 6px 19px 6px;color:#c8e5ee;font-size:36px;font-weight:900;font-style:italic;box-shadow:0 7px 20px #0004}
.v4-player-art img{width:100%;height:100%;object-fit:cover;object-position:center top;border-radius:0;max-width:100%}.v4-player-art>span{z-index:1}.v4-player-art svg{width:70%;height:70%;opacity:.8}
.v4-scoreboard{display:flex;align-items:center;justify-content:space-between;gap:18px;border:1px solid #4a7d90;background:linear-gradient(100deg,#173f4e,#11273a);padding:20px 25px;border-radius:5px;margin:15px 0;box-shadow:inset 0 2px 0 #79cfdd26}
.v4-scoreboard strong{font-size:35px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:3px;color:#e9ffd0}.v4-scoreboard span{font-weight:750;font-size:12px;color:#c5e2f1}.v4-scoreboard small{color:#7eb7cc}
.v4-tactics{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.v4-tactics button{background:#152c42;border:1px solid #3a5d78;min-height:44px;padding:10px 15px;color:#b9d9ed;border-radius:5px;font-weight:650;font-size:12px}.v4-tactics button.active{background:#2c4b36;border-color:#a6c966;color:#d9f5a6}.v4-tactics button:hover{border-color:#64cfdf}
.v4-dashboard,.v4-command-grid,.v4-trophy-grid,.v4-family-grid{animation:v4-reveal .4s ease-out both}
