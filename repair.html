<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>逐梦绿茵 · 保留存档修复启动</title><style>body{margin:0;background:#07121f;color:#e8f6ff;font:16px/1.9 system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center}main{max-width:460px;margin:20px;padding:28px;border:1px solid #426479;border-top:4px solid #c9ef74;border-radius:12px;background:#12283a}small{color:#62dce8;letter-spacing:2px}h1{font-size:27px;line-height:1.5}p{color:#afc7d8;font-size:14px}button,a{display:inline-block;padding:12px 16px;background:#c9ef74;color:#1d3429;border:0;border-radius:6px;font-weight:700;font-size:14px;text-decoration:none;margin:6px 5px 6px 0}button.secondary{background:#1b3a50;color:#d8edf8;border:1px solid #507188}#status{color:#dcf59e}</style></head><body><main><small>TOUCHLINE · SAFE START</small><h1>保留生涯，重新连接球场。</h1><p>这里只重置旧版的离线连接，不删除存档、球队、成就或培养记录。</p><p id="status">正在检查旧版连接…</p><button id="repair">修复并进入游戏</button><button id="backup" class="secondary">先下载存档备份</button><p>完成后会自动回到原来的游戏网址。</p></main><script>(function(){'use strict';var target=new URL('../touchline-life-v3/',location.href),status=document.getElementById('status'),button=document.getElementById('repair'),busy=false,raw=null;try{raw=localStorage.getItem('touchline-career-pro-v2');}catch(e){}document.getElementById('backup').disabled=!raw;document.getElementById('backup').onclick=function(){if(!raw)return;var a=document.createElement('a'),url=URL.createObjectURL(new Blob([raw],{type:'application/json'}));a.href=url;a.download='逐梦绿茵-修复前存档备份.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},30000);};async function repair(){if(busy)return;busy=true;button.disabled=true;status.textContent='正在更新连接，已有存档保持不变…';try{if('serviceWorker'in navigator){var list=await navigator.serviceWorker.getRegistrations();await Promise.all(list.filter(function(r){return r.scope===target.href;}).map(function(r){return r.unregister();}));}status.textContent='连接已修复，正在返回游戏…';location.replace(target.href+'?startup=46');}catch(e){busy=false;button.disabled=false;status.textContent='连接暂未完成，请点击修复按钮重试；也可以先下载存档。';}}button.onclick=repair;setTimeout(repair,900);})();</script></body></html>
